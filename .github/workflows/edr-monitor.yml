name: EDR — LIGA360 company codes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edr-liga-company-codes
  cancel-in-progress: false

jobs:
  match-company-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check requests lxml
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Build mappings from official UO XML
        env:
          EDR_UO_URL: ${{ secrets.EDR_UO_URL }}
        run: python scripts/edr_monitor.py

      - name: Save result as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edr-liga-companycodes
          path: |
            data/edrpou_names.csv
            data/companycodes_all.csv
            data/companycodes_review.csv
            data/match_summary.json
          retention-days: 14

      # No automatic commit. Review matches before copying into OneDrive.
