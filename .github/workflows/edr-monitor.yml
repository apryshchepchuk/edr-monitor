name: EDRPOU Monitor

on:
  workflow_dispatch: 


permissions:
  contents: write

concurrency:
  group: edrpou-monitor
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Run monitor
        env:
          EDR_UO_URL: ${{ secrets.EDR_UO_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FORCE: ${{ secrets.EMAIL_FORCE }}
          EMAIL_SEND_NO_CHANGES: ${{ secrets.EMAIL_SEND_NO_CHANGES }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          TIMEZONE: Europe/Kyiv
        run: python scripts/edr_monitor.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data docs/data docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EDRPOU monitor data"
            git push
          fi
